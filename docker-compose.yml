services:
  lucario-sync:
    build: .
    image: lucario-sync:latest
    container_name: lucario-sync
    restart: unless-stopped
    ports:
      - "8080:8080"          # host:container — change the left side if 8080 is taken
    environment:
      PORT: "8080"
      RATE_PER_MIN: "120"    # requests per minute from one IP
      TTL_HOURS: "6"         # a record lives 6 hours without updates; clients 1.4.2+
                             # refresh it every heartbeatMinutes minutes (default 15),
                             # so active players' records never expire, while abandoned
                             # ones (mod uninstalled) disappear on their own within 6-7 hours.
                             # Set to "0" to fall back to TTL_DAYS.
      TTL_DAYS: "30"         # used only when TTL_HOURS="0"
      HOUSEKEEPING_SECONDS: "600"  # how often expired records are cleaned up (minimum 1)
      # --- record authorization via Mojang (safe to leave untouched) ---
      # MOJANG_SESSION: "https://sessionserver.mojang.com"  # can be replaced with a stub for tests
      # CHALLENGE_TTL: "300"     # lifetime of a one-shot challenge, sec
      # MAX_PENDING: "10000"     # maximum unfinished challenges
      # --- 1.5.4: strict authorization + per-IP WebSocket cap (defaults are on) ---
      REQUIRE_AUTH: "1"        # every record write needs the Mojang token; the mod
                               # client claims itself automatically on the first 401.
                               # "0" restores the legacy opt-in (unclaimed = open).
      # --- 1.5.7: rotating hashed tokens (defaults are sane; safe to leave) ---
      # TOKEN_TTL_DAYS: "30"   # a write token expires after N days (0 = never).
                               # Clients re-authorize silently on the next 401, so
                               # expiry is invisible to players — but a leaked
                               # token dies on its own instead of living forever.
                               # tokens.json stores SHA-256 hashes only.
      MAX_WS_PER_IP: "5"       # live WS sockets per client IP; one player needs one,
                               # 5 covers shared VPN/NAT exits, floods get 429. "0" = off.
      # --- 1.5.5: per-socket WebSocket guards (defaults are sane; safe to leave) ---
      # WS_BURST: "4"              # frame-token bucket per socket; EVERY frame except
      #                            # close pays one token (hello, watch, ping, pong...)
      # WS_REFILL_MS: "250"        # one token back per interval (legit bursts never notice)
      # WS_DROP_KILL: "32"         # consecutive dropped frames without a paid one in
      #                            # between = a flood -> the session is closed
      # WS_ASSEMBLY_DEADLINE: "10" # a fragmented message must finish assembling within
      #                            # this many seconds and obey the 8 KiB payload cap
      # HELLO_DEADLINE: "10"       # the mod says hello right after the upgrade; a socket
      #                            # silent this long is a scanner and gets dropped
      # --- emote animations over WebSocket (since 1.5.0, same port; safe defaults) ---
      # ANIM_TTL_SECONDS: "30"   # an active emote expires without refresh after this;
      #                          # mod clients re-send it every 10 s, so this only bites
      #                          # when a game crashes mid-emote (the expiry is pushed as a stop)
      # ANIM_SWEEP_SECONDS: "5"  # how often the emote expiry sweeper runs
      # MAX_ANIM_RECORDS: "50000"  # emote records are memory-only
      # MAX_WS_CLIENTS: "2000"   # live WebSocket sockets ceiling
      # WS_PING_SECONDS: "20"    # server pings; 35 s of client silence closes the socket
      # --- 1.5.6: HTTP penalty box (defaults are sane; safe to leave) ---
      # PENALTY_HITS: "30"       # 429s within one 60 s window (rate limiter + per-IP
      #                          # WS cap) put the source IP into the box; "0" disables
      # PENALTY_MINUTES: "10"    # how long a banned IP stays banned
      # PENALTY_MAX: "10000"     # ceiling of tracked IPs (when full, new IPs are
      #                          # answered but no longer tracked — the box cannot
      #                          # grow unbounded; live bans are never evicted)
    volumes:
      - ./data:/data         # morphs.json (morphs) + tokens.json (tokens) — survive rebuilds
    logging:                # 1.5.6: a hard ceiling on the json-file log (the one
      driver: json-file     # thing a request flood could previously grow forever)
      options:
        max-size: "10m"
        max-file: "3"
